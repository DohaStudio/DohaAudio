[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dohaaudio"
version = "0.1.0"
description = "DohaAudio provider runtime foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
runtime = ["uvicorn[standard]>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dohaaudio.fixtures" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
